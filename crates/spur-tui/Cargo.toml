[package]
name = "spur-tui"
description = "Terminal frontend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# M1 runs the session in-process; with the daemon (#22) this becomes spur-protocol.
spur-core.workspace = true
spur-keymap.workspace = true
spur-text.workspace = true
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
serde_json = "1.0"

[dev-dependencies]
