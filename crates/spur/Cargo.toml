[package]
name = "spur"
description = "The spur binary: TUI, GUI, headless server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
spur-core.workspace = true
spur-keymap.workspace = true
serde_json = "1.0"
spur-tui = { workspace = true, optional = true }
spur-gui = { workspace = true, optional = true }
spur-vim = { workspace = true, optional = true }

[features]
# Frontends are optional so a headless/remote server build skips the GUI stack.
default = ["tui", "gui", "preset-vim"]
tui = ["dep:spur-tui"]
gui = ["dep:spur-gui"]
# Optional key presets, shipped as extensions and loaded only on request.
preset-vim = ["dep:spur-vim"]
