[package]
name = "spur"
description = "The spur binary: TUI, GUI, headless server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
spur-text.workspace = true
spur-core.workspace = true
spur-keymap.workspace = true
spur-ext.workspace = true
spur-rpc.workspace = true
spur-server.workspace = true
spur-tui = { workspace = true, optional = true }
spur-gui = { workspace = true, optional = true }

[features]
# Frontends are optional so a headless/remote server build skips the GUI stack.
default = ["tui", "gui"]
tui = ["dep:spur-tui"]
gui = ["dep:spur-gui"]
