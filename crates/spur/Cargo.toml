[package]
name = "spur"
description = "The spur launcher: starts or finds a session and attaches a frontend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
spur-rpc.workspace = true
spur-server.workspace = true
spur-tui = { workspace = true, optional = true }
spur-gui = { workspace = true, optional = true }

[features]
# Frontends are optional so a headless/remote server build skips them.
default = ["tui", "gui"]
tui = ["dep:spur-tui"]
gui = ["dep:spur-gui"]
