# The icon rail: four icons on the app background, no outline. The icon of the view
# that is showing is lit; the sidebar card's title names it. Clicking an icon shows
# that view and focuses the sidebar; clicking the lit icon closes the sidebar.
# Later on_click entries win when their when holds, as in keys.toml.

[node.rail]
kind = "column"
width = 3
padding = [1, 0]
gap = 1
children = ["rail_files", "rail_sessions", "rail_search", "rail_git"]

[node.rail_files]
kind = "icon"
width = "fill"
icon = "files"
style = "rail.item"
style_active = "rail.item.active"
active = "ui.sidebar == files && cond.sidebar_shown"
on_click = [
  { run = [
    { command = "ui.set", args = { key = "ui.sidebar", value = "files" } },
    { command = "ui.set", args = { key = "ui.sidebar_open", value = true } },
    { command = "ui.focus", args = { region = "sidebar" } },
  ] },
  { when = "ui.sidebar == files && cond.sidebar_shown", command = "ui.set", args = { key = "ui.sidebar_open", value = false } },
]

