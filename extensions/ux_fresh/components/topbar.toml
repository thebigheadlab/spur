# The top bar: brand and workspace on the left; on the right the notice, or the name
# of the focused panel and its keys. Key hints are {key:<action>}: the action's first
# key that works where focus is, printed by pack.toml [keys.display]. The workspace
# name gives way when the row is short of room.

[node.topbar]
kind = "row"
height = 1
padding = [0, 2]
gap = 1
children = ["brand_mark", "brand", "brand_sep", "workspace", "notice_mark", "notice", "keys"]

[node.brand_mark]
kind = "icon"
icon = "brand"
style = "brand.mark"

[node.brand]
kind = "text"
text = "spur"
style = "brand"
when = "client.cols >= 100"

[node.brand_sep]
kind = "text"
text = "/"
style = "path"
when = "client.cols >= 100"

[node.workspace]
kind = "text"
width = "fill"
text = "{workspace.name}"
style = "path"

# The notice (quit prompt, failed command, broken pack) takes the place of the keys.
[node.notice_mark]
kind = "icon"
icon = "modified"
style = "notice.mark"
when = "ui.notice"

[node.notice]
kind = "text"
text = "{ui.notice}"
style = "notice"
when = "ui.notice"

# Command pill: the focused panel's name, at most two keys of its own, and a pill
# that looks like the palette's field and opens it (by key or by a click).

[node.keys]
kind = "row"
width = "fit"
gap = 2
when = "!ui.notice"
children = ["keys_code", "keys_files", "keys_sidebar", "keys_agent", "keys_palette", "pill"]

[node.at_code]
kind = "text"
text = " CODE "
style = "focus"

[node.keys_code]
kind = "row"
width = "fit"
gap = 1
when = "ui.focus == editor"
children = ["at_code"]

[node.at_files]
kind = "text"
text = " FILES "
style = "focus"

[node.keys_files]
kind = "row"
width = "fit"
gap = 1
when = "ui.focus == sidebar && ui.sidebar == files"
children = ["at_files", "p_files_open", "p_files_esc"]

[node.k_files_open]
kind = "text"
text = "{key:list_open}"
style = "key"

[node.h_files_open]
kind = "text"
text = "open"
style = "hint"

[node.p_files_open]
kind = "row"
width = "fit"
gap = 1
children = ["k_files_open", "h_files_open"]

[node.s_files_esc]
kind = "text"
text = "·"
style = "hint.sep"

[node.k_files_esc]
kind = "text"
text = "{key:back_to_code}"
style = "key"

[node.h_files_esc]
kind = "text"
text = "code"
style = "hint"

[node.p_files_esc]
kind = "row"
width = "fit"
gap = 1
children = ["s_files_esc", "k_files_esc", "h_files_esc"]

[node.at_sidebar]
kind = "text"
text = " SIDEBAR "
style = "focus"

[node.keys_sidebar]
kind = "row"
width = "fit"
gap = 1
when = "ui.focus == sidebar && ui.sidebar != files"
children = ["at_sidebar", "p_sidebar_esc"]

[node.k_sidebar_esc]
kind = "text"
text = "{key:back_to_code}"
style = "key"

[node.h_sidebar_esc]
kind = "text"
text = "code"
style = "hint"

[node.p_sidebar_esc]
kind = "row"
width = "fit"
gap = 1
children = ["k_sidebar_esc", "h_sidebar_esc"]

[node.at_agent]
kind = "text"
text = " AGENT "
style = "focus"

[node.keys_agent]
kind = "row"
width = "fit"
gap = 1
when = "ui.focus == agent"
children = ["at_agent", "p_agent_tabs", "p_agent_esc"]

[node.k_agent_tabs]
kind = "text"
text = "{key:agent_tab_prev}/{key:agent_tab_next}"
style = "key"

[node.h_agent_tabs]
kind = "text"
text = "tabs"
style = "hint"

[node.p_agent_tabs]
kind = "row"
width = "fit"
gap = 1
when = "client.cols >= 100"
children = ["k_agent_tabs", "h_agent_tabs"]

[node.s_agent_esc]
kind = "text"
text = "·"
style = "hint.sep"

[node.k_agent_esc]
kind = "text"
text = "{key:back_to_code}"
style = "key"

[node.h_agent_esc]
kind = "text"
text = "code"
style = "hint"

[node.p_agent_esc]
kind = "row"
width = "fit"
gap = 1
children = ["s_agent_esc", "k_agent_esc", "h_agent_esc"]

[node.at_palette]
kind = "text"
text = " PALETTE "
style = "focus"

[node.keys_palette]
kind = "row"
width = "fit"
gap = 1
when = "ui.focus == palette"
children = ["at_palette", "p_palette_run", "p_palette_close"]

[node.k_palette_run]
kind = "text"
text = "{key:list_open}"
style = "key"

[node.h_palette_run]
kind = "text"
text = "run"
style = "hint"

[node.p_palette_run]
kind = "row"
width = "fit"
gap = 1
children = ["k_palette_run", "h_palette_run"]

[node.s_palette_close]
kind = "text"
text = "·"
style = "hint.sep"

[node.k_palette_close]
kind = "text"
text = "{key:palette_close}"
style = "key"

[node.h_palette_close]
kind = "text"
text = "close"
style = "hint"

[node.p_palette_close]
kind = "row"
width = "fit"
gap = 1
children = ["s_palette_close", "k_palette_close", "h_palette_close"]

[node.pill]
kind = "row"
width = "fit"
gap = 0
when = "ui.focus != palette"
children = ["pill_l", "pill_mark", "pill_text", "pill_key"]
on_click = [{ action = "palette_all" }]

[node.pill_l]
kind = "text"
text = " "
style = "pill"

[node.pill_mark]
kind = "icon"
icon = "prompt"
style = "pill.mark"

[node.pill_text]
kind = "text"
text = " Go to file or action   "
style = "pill"
when = "client.cols >= 120"

[node.pill_key]
kind = "text"
text = " {key:palette_all} "
style = "pill.key"
