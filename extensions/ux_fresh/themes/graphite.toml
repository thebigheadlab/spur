# Graphite theme. Palette names are used only inside this file.
dark = true

[palette]
bg = "#111215"
card = "#141518"       # inside a card: a shade above the app background
field = "#202227"      # the ask box (soft)
soft = "#202227"
chip = "#202227"       # pills: key hints, tabs, the file name (soft)
edge = "#3a3d45"       # card outlines
t1 = "#ecedf0"
t2 = "#a4a7b0"
dim = "#888c95"        # quiet text that must still be read (4.5:1 or better)
t3 = "#6c707a"
sel = "#262a4a"
accent = "#8b93ff"
accent_text = "#8b93ff" # accent as text: the accent itself
need = "#f0b37e"
kw = "#c49cde"
fn = "#7fb8f0"
ty = "#e6c98f"
num = "#7fd1c7"
punct = "#80858f"
str = "#a5cf9a"
comment = "#6c707a"

[tokens]
# Surfaces and outlines
"app" = { fg = "t2", bg = "bg" }
"card" = { bg = "card" }
"edge" = { fg = "edge" }
"edge.focus" = { fg = "accent" }

# Top bar
"brand.mark" = { fg = "accent" }
"brand" = { fg = "t1", bold = true }
"path" = { fg = "dim" }
"notice.mark" = { fg = "need" }
"notice" = { fg = "t1" }
"focus" = { fg = "accent_text", bg = "sel", bold = true }
"key" = { fg = "t2", bg = "chip" }
"hint" = { fg = "dim" }

# Rail, titles and text
"rail.item" = { fg = "dim" }
"rail.item.active" = { fg = "t1", bg = "chip" }
"label" = { fg = "dim", bold = true }
"title" = { fg = "t1", bg = "chip", bold = true }
"subtitle" = { fg = "dim" }
"modified" = { fg = "need" }
"tab" = { fg = "dim" }
"tab.active" = { fg = "t1", bg = "chip", bold = true }
"empty" = { fg = "dim" }
"empty.title" = { fg = "t2" }
"field" = { bg = "field" }
"prompt" = { fg = "t2", bold = true }
"input" = { fg = "dim" }

# Fixed tokens (named by the protocol)
"gutter" = { fg = "t3" }
"gutter.current" = { fg = "t1" }
"line.current" = { bg = "soft" }
"selection" = { bg = "sel" }
"cursor.secondary" = { fg = "bg", bg = "accent" }
"cursor.peer" = { fg = "bg", bg = "need" }
"list.row" = { fg = "t2" }
"list.row.selected" = {}
"list.row.current" = { fg = "t1", bg = "soft" }
"list.row.selected.focused" = { fg = "t1", bg = "sel" }
"list.dir" = { fg = "t1" }
"list.icon" = { fg = "t3" }
"list.more" = { fg = "dim", italic = true }
"list.error" = { fg = "need" }
"list.detail" = { fg = "t3" }
"list.key" = { fg = "dim" }
"list.match" = { fg = "accent_text", bold = true }
"list.section" = { fg = "dim", bold = true }
"overlay.dim" = { bg = "bg" }
"syntax.keyword" = { fg = "kw" }
"syntax.type" = { fg = "ty" }
"syntax.function" = { fg = "fn" }
"syntax.string" = { fg = "str" }
"syntax.number" = { fg = "num" }
"syntax.comment" = { fg = "comment", italic = true }
"syntax.punctuation" = { fg = "punct" }
