# --- Sidebar ---

[[bind]]
mode = "sidebar"
keys = "<Up>"
command = "ui.list.move"
args = { by = -1 }

[[bind]]
mode = "sidebar"
keys = "<Down>"
command = "ui.list.move"
args = { by = 1 }

[[bind]]
mode = "sidebar"
keys = "<PageUp>"
command = "ui.list.page"
args = { by = -1 }

[[bind]]
mode = "sidebar"
keys = "<PageDown>"
command = "ui.list.page"
args = { by = 1 }

[[bind]]
mode = "sidebar"
keys = "<Right>"
command = "ui.tree.expand"

[[bind]]
mode = "sidebar"
keys = "<Left>"
command = "ui.tree.collapse"

[[bind]]
mode = "sidebar"
keys = "<CR>"
command = "ui.list.activate"

[[bind]]
mode = "sidebar"
keys = "<Esc>"
command = "ui.focus"
args = { region = "editor" }


# --- Agent column ---

[[bind]]
mode = "agent"
keys = "<Left>"
command = "ui.cycle"
args = { key = "ui.agent_tab", by = -1 }

[[bind]]
mode = "agent"
keys = "<Right>"
command = "ui.cycle"
args = { key = "ui.agent_tab", by = 1 }

[[bind]]
mode = "agent"
keys = "<Esc>"
command = "ui.focus"
args = { region = "editor" }
