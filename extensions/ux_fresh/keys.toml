# ux_fresh default keys (locked keys sheet, limited to commands that exist so far).
# Format: spur-keymap layer. Keys that run a named action are listed with the action
# in actions.toml and bound before this file, so a binding here wins over them for
# the same keys when its `when` holds: that is how a key's special cases are added.
#
# Modes: "insert" is the code view's mode; "sidebar", "agent" and "palette" are the
# modes of those focused regions (pack.toml [regions]).

[mode.insert]
fallback = "editor.insert_text"   # unbound printable keys type

# --- Code: moving and editing ---

[[bind]]
mode = "insert"
keys = "<Left>"
command = "editor.move_left"

[[bind]]
mode = "insert"
keys = "<Right>"
command = "editor.move_right"

[[bind]]
mode = "insert"
keys = "<Up>"
command = "editor.move_up"

[[bind]]
mode = "insert"
keys = "<Down>"
command = "editor.move_down"

[[bind]]
mode = "insert"
keys = "<Home>"
command = "editor.move_first_nonblank"

[[bind]]
mode = "insert"
keys = "<End>"
command = "editor.move_line_end"

[[bind]]
mode = "insert"
keys = "<C-Home>"
command = "editor.move_doc_start"

[[bind]]
mode = "insert"
keys = "<C-End>"
command = "editor.move_doc_end"

[[bind]]
mode = "insert"
keys = "<C-Left>"
command = "editor.move_word_prev"

[[bind]]
mode = "insert"
keys = "<C-Right>"
command = "editor.move_word_next"

[[bind]]
mode = "insert"
keys = "<CR>"
command = "editor.insert_newline"

[[bind]]
mode = "insert"
keys = "<BS>"
command = "editor.delete_backward"

[[bind]]
mode = "insert"
keys = "<Del>"
command = "editor.delete_forward"

[[bind]]
mode = "insert"
keys = "<Tab>"
command = "editor.insert_text"
args = { text = "    " }


# --- Shell: special cases of the action keys (actions.toml) ---

# ctrl+b: shows and focuses the sidebar (the action); hides it while shown, and
# shows it without moving focus when it fits but is closed.
[[bind]]
mode = "insert sidebar agent"
keys = "<C-b>"
when = "cond.sidebar_fits && !ui.sidebar_open"
command = "ui.set"
args = { key = "ui.sidebar_open", value = true }

[[bind]]
mode = "insert sidebar agent"
keys = "<C-b>"
when = "cond.sidebar_shown"
command = "ui.set"
args = { key = "ui.sidebar_open", value = false }

# ctrl+alt+b: the same for the agent column.
[[bind]]
mode = "insert sidebar agent"
keys = "<C-A-b>"
when = "cond.agent_fits && !ui.agent_open"
command = "ui.set"
args = { key = "ui.agent_open", value = true }

[[bind]]
mode = "insert sidebar agent"
keys = "<C-A-b>"
when = "cond.agent_shown"
command = "ui.set"
args = { key = "ui.agent_open", value = false }

# A view's keys again while it has focus return to the code.
[[bind]]
mode = "insert sidebar agent"
keys = "<C-k>a"
when = "ui.focus == agent"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<C-S-e>"
when = "ui.focus == sidebar && ui.sidebar == files"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<A-1>"
when = "ui.focus == sidebar && ui.sidebar == files"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<C-k>e"
when = "ui.focus == sidebar && ui.sidebar == files"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<C-S-j>"
when = "ui.focus == sidebar && ui.sidebar == sessions"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<A-2>"
when = "ui.focus == sidebar && ui.sidebar == sessions"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<C-k>j"
when = "ui.focus == sidebar && ui.sidebar == sessions"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<C-S-f>"
when = "ui.focus == sidebar && ui.sidebar == search"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<A-3>"
when = "ui.focus == sidebar && ui.sidebar == search"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<C-k>f"
when = "ui.focus == sidebar && ui.sidebar == search"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<C-S-g>"
when = "ui.focus == sidebar && ui.sidebar == git"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<A-4>"
when = "ui.focus == sidebar && ui.sidebar == git"
command = "ui.focus"
args = { region = "editor" }

[[bind]]
mode = "insert sidebar agent"
keys = "<C-k>g"
when = "ui.focus == sidebar && ui.sidebar == git"
command = "ui.focus"
args = { region = "editor" }


# --- Sidebar ---

[[bind]]
mode = "sidebar"
keys = "<Right>"
command = "ui.tree.expand"

[[bind]]
mode = "sidebar"
keys = "<Left>"
command = "ui.tree.collapse"


# --- Palette: its query input (up/down, enter, esc and quit are actions) ---

[mode.palette]
fallback = "ui.input.insert"      # printable keys type into the query

[[bind]]
mode = "palette"
keys = "<BS>"
command = "ui.input.delete_backward"

[[bind]]
mode = "palette"
keys = "<Del>"
command = "ui.input.delete_forward"

[[bind]]
mode = "palette"
keys = "<Left>"
command = "ui.input.move"
args = { by = "char", back = true }

[[bind]]
mode = "palette"
keys = "<Right>"
command = "ui.input.move"
args = { by = "char" }

[[bind]]
mode = "palette"
keys = "<S-Left>"
command = "ui.input.move"
args = { by = "char", back = true, extend = true }

[[bind]]
mode = "palette"
keys = "<S-Right>"
command = "ui.input.move"
args = { by = "char", extend = true }

[[bind]]
mode = "palette"
keys = "<C-Left>"
command = "ui.input.move"
args = { by = "word", back = true }

[[bind]]
mode = "palette"
keys = "<C-Right>"
command = "ui.input.move"
args = { by = "word" }

[[bind]]
mode = "palette"
keys = "<Home>"
command = "ui.input.move"
args = { by = "start", back = true }

[[bind]]
mode = "palette"
keys = "<End>"
command = "ui.input.move"
args = { by = "end" }
