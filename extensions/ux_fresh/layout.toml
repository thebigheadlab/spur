# The shell: top bar over a row of rail | sidebar | code | agent column.
# Each panel is a card with a rounded outline (pack.toml [borders]). The card that
# has focus draws its outline in the accent colour; the others stay dim.

[node.root]
kind = "column"
style = "app"
children = ["topbar", "body"]

[node.body]
kind = "row"
padding = [0, 1]
gap = 1
children = ["rail", "sidebar", "main", "agent"]
