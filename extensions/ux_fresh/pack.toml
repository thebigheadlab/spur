# ux_fresh: Spur's default look, hairline rounded cards. Every colour, glyph, label and key lives in this folder.
id = "ux_fresh"            # keymap layer name is "ux:ux_fresh"
name = "Fresh"
format = 0                 # pack format version
root = "root"              # id of the root node (layout.toml)
theme = "graphite"         # themes/graphite.toml

[state]                    # per-client UI state: key -> default
"ui.sidebar" = "files"
"ui.sidebar_open" = true
"ui.agent_open" = true
"ui.agent_tab" = "chat"

[state_values]             # allowed values for string keys (also the ui.cycle order)
"ui.sidebar" = ["files", "sessions", "search", "git"]
"ui.agent_tab" = ["chat", "threads", "library", "memory"]

[conditions]               # named when clauses, readable as cond.<name>
# The sidebar shows when open from 100 cols, where the code column keeps >= 64 cells
# beside it. Below 144 cols it gives way while the agent column has focus: the two do
# not fit beside the code together, and the code column is then narrower than 64
# (about 47 cells at 100 cols). It always shows while it has focus itself.
sidebar_shown = "ui.sidebar_open && ((client.cols >= 100 && (client.cols >= 144 || ui.focus != agent)) || ui.focus == sidebar)"
# The agent column shows when open and there is room beside an open sidebar
# (144 cols), or whenever it has focus.
agent_shown = "ui.agent_open && (client.cols >= 144 || ui.focus == agent)"
# Whether each fits where focus is now, for keys.toml (conditions cannot read each
# other, so the numbers above repeat here; keep them in step).
sidebar_fits = "client.cols >= 100 && (client.cols >= 144 || ui.focus != agent)"
agent_fits = "client.cols >= 144"

[regions]                  # focusable regions: name -> node and key mode
editor = { node = "code" }                       # the surface; mode = the view's own mode
sidebar = { node = "sidebar", mode = "sidebar" }
agent = { node = "agent", mode = "agent" }
palette = { node = "palette", mode = "palette" }  # components/palette.toml

[overlays]                 # trees drawn over the shell; one is open at a time
# The palette: centred, 72 cells wide, 3 rows down, the shell behind it dimmed by
# half. A press outside it runs on_dismiss.
palette = { node = "palette", top = 3, width = 72, max_height = 20, dim = 50, on_dismiss = "palette_close" }

[palette]
prefixes = { ">" = "actions", ":" = "line" }  # typed first in an empty query

[keys.display]             # how key hints print keys
ctrl = "ctrl+"
shift = "shift+"
alt = "alt+"
names = { Space = "space", CR = "enter", Esc = "esc", BS = "backspace", Del = "delete", Up = "up", Down = "down", Left = "left", Right = "right", PageUp = "page up", PageDown = "page down" }

[icons]                    # one cell wide each; ascii is the fallback
files = { glyph = "≡", ascii = "F" }
sessions = { glyph = "◇", ascii = "T" }
search = { glyph = "⊙", ascii = "S" }
git = { glyph = "±", ascii = "G" }
folder = { glyph = "▸", ascii = "+" }
folder_open = { glyph = "▾", ascii = "-" }
file = { glyph = "·", ascii = " " }
modified = { glyph = "●", ascii = "*" }
brand = { glyph = "◆", ascii = "*" }
prompt = { glyph = "›", ascii = ">" }

[borders]                  # six one-cell glyphs: corners (tl tr bl br), horizontal, vertical
round = { glyphs = "╭╮╰╯─│", ascii = "++++-|" }

[languages]                # language id -> label shown in the code header
c = "C"
cpp = "C++"
go = "Go"
java = "Java"
javascript = "JavaScript"
json = "JSON"
markdown = "Markdown"
python = "Python"
rust = "Rust"
shell = "Shell"
text = "Plain text"
toml = "TOML"
typescript = "TypeScript"
yaml = "YAML"

[messages]                 # text the server produces
"doc.untitled" = "untitled"
"quit.unsaved" = "ctrl+q again to quit without saving {doc}"
"command.failed" = "{command}: {reason}"
"list.more" = "{count} more"
"list.unreadable" = "cannot read: {reason}"
# The palette.
"palette.scope.all" = "Go to"
"palette.scope.files" = "Files"
"palette.scope.recent" = "Recent"
"palette.scope.actions" = "Actions"
"palette.scope.line" = "Line"
"palette.section.files" = "FILES"
"palette.section.recent" = "RECENT"
"palette.section.actions" = "ACTIONS"
"palette.no_matches" = "No matches"
"palette.no_folder" = "No folder open"
"palette.indexing" = "Indexing… {count} files so far"
"palette.capped" = "Showing the first {count} files"
"palette.line.go" = "Go to line {line}"
"palette.line.go_col" = "Go to line {line}, column {col}"
"palette.line.last" = "Go to the last line ({line})"
"palette.line.hint" = "Type a line number, or line:column"
