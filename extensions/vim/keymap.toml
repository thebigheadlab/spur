# Vim preset: data only. Every key maps to a core command; the modal grammar
# (operators, motions, text objects, `.`, macros) is executed by the core.
# Deviations from Vim are marked `# deviation:`.

[mode.normal]
counts = true
registers = true
block_cursor = true
cursor = "block"

[mode.insert]
groups_edits = true
fallback = "editor.insert_text"
cursor = "bar"

[mode.operator]
counts = true
block_cursor = true
cursor = "underline"

[mode.visual]
counts = true
registers = true
block_cursor = true
inclusive_selection = true
cursor = "block"

[mode.visual_line]
counts = true
registers = true
block_cursor = true
linewise_selection = true
cursor = "block"

[mode.cmdline]
groups_edits = true
fallback = "vim.cmdline_insert"
cursor = "bar"

# ---- motions: normal and operator-pending ----

