keys = ","
command = "vim.repeat_find"
args = { reverse = true }

[[bind]]
mode = "normal operator"
keys = "%"
command = "vim.match_bracket"

[[bind]]
mode = "normal operator"
keys = "n"
command = "vim.search_next"

[[bind]]
mode = "normal operator"
keys = "N"
command = "vim.search_next"
