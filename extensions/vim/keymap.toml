# ---- operators ----

[[bind]]
mode = "normal"
keys = "d"
command = "vim.begin_operator"
args = { op = "delete" }

[[bind]]
mode = "normal"
keys = "c"
command = "vim.begin_operator"
args = { op = "change" }

[[bind]]
mode = "normal"
keys = "y"
command = "vim.begin_operator"
args = { op = "yank" }

[[bind]]
mode = "normal"
keys = ">"
command = "vim.begin_operator"
args = { op = "indent" }

[[bind]]
mode = "normal"
keys = "<lt>"
command = "vim.begin_operator"
args = { op = "outdent" }

[[bind]]
mode = "normal"
keys = "gu"
label = "lowercase"
command = "vim.begin_operator"
args = { op = "lower" }

[[bind]]
mode = "normal"
keys = "gU"
label = "uppercase"
command = "vim.begin_operator"
args = { op = "upper" }

[[bind]]
mode = "normal"
keys = "g~"
label = "toggle case"
command = "vim.begin_operator"
args = { op = "toggle_case" }

[[group]]
mode = "normal"
keys = "g"
label = "+goto/case"

# Doubled operators act on lines: dd cc yy >> << guu gUU g~~.
[[bind]]
mode = "operator"
keys = "d"
command = "vim.operator_line"
when = "vim.operator == delete"

[[bind]]
mode = "operator"
keys = "c"
command = "vim.operator_line"
when = "vim.operator == change"

[[bind]]
mode = "operator"
keys = "y"
command = "vim.operator_line"
when = "vim.operator == yank"

[[bind]]
mode = "operator"
keys = ">"
command = "vim.operator_line"
when = "vim.operator == indent"

[[bind]]
mode = "operator"
keys = "<lt>"
command = "vim.operator_line"
when = "vim.operator == outdent"

[[bind]]
mode = "operator"
keys = "u"
command = "vim.operator_line"
when = "vim.operator == lower"

[[bind]]
mode = "operator"
keys = "U"
command = "vim.operator_line"
when = "vim.operator == upper"

[[bind]]
mode = "operator"
keys = "~"
command = "vim.operator_line"
when = "vim.operator == toggle_case"

# `cw` changes to the end of the word, like `ce`.
[[bind]]
mode = "operator"
keys = "w"
command = "editor.move_word_end"
when = "vim.operator == change"

[[bind]]
mode = "operator"
keys = "W"
command = "editor.move_word_end"
args = { big = true }
when = "vim.operator == change"

[[bind]]
mode = "operator visual visual_line"
keys = "i<char>"
command = "vim.text_object"
args = { inner = true }
label = "inner object"

[[bind]]
mode = "operator visual visual_line"
keys = "a<char>"
command = "vim.text_object"
label = "around object"

[[bind]]
mode = "operator"
keys = "<Esc>"
command = "vim.cancel_operator"

# ---- shortcuts ----

[[bind]]
mode = "normal"
keys = "x"
run = [{ command = "vim.begin_operator", args = { op = "delete" } }, { command = "editor.move_right", args = { wrap = false } }]

[[bind]]
mode = "normal"
keys = "<Del>"
run = [{ command = "vim.begin_operator", args = { op = "delete" } }, { command = "editor.move_right", args = { wrap = false } }]

[[bind]]
mode = "normal"
keys = "X"
run = [{ command = "vim.begin_operator", args = { op = "delete" } }, { command = "editor.move_left", args = { wrap = false } }]

[[bind]]
mode = "normal"
keys = "D"
run = [{ command = "vim.begin_operator", args = { op = "delete" } }, { command = "editor.move_line_end" }]

[[bind]]
mode = "normal"
keys = "C"
run = [{ command = "vim.begin_operator", args = { op = "change" } }, { command = "editor.move_line_end" }]

[[bind]]
mode = "normal"
keys = "s"
run = [{ command = "vim.begin_operator", args = { op = "change" } }, { command = "editor.move_right", args = { wrap = false } }]

[[bind]]
mode = "normal"
keys = "S"
run = [{ command = "vim.begin_operator", args = { op = "change" } }, { command = "vim.operator_line" }]

[[bind]]
mode = "normal"
keys = "Y"
run = [{ command = "vim.begin_operator", args = { op = "yank" } }, { command = "vim.operator_line" }]

# deviation: `~` toggles case but does not move the cursor right.
[[bind]]
mode = "normal"
keys = "~"
run = [{ command = "vim.begin_operator", args = { op = "toggle_case" } }, { command = "editor.move_right", args = { wrap = false } }]

[[bind]]
mode = "normal"
keys = "r<char>"
command = "vim.replace_char"

[[bind]]
mode = "normal"
keys = "J"
command = "vim.join_lines"

[[bind]]
mode = "normal"
keys = "p"
command = "editor.paste"
args = { before = false, cursor_on_last = true }

[[bind]]
mode = "normal"
keys = "P"
command = "editor.paste"
args = { before = true, cursor_on_last = true }

[[bind]]
mode = "normal"
keys = "u"
command = "editor.undo"

[[bind]]
mode = "normal"
keys = "<C-r>"
command = "editor.redo"

[[bind]]
mode = "normal"
keys = "."
command = "vim.repeat"

[[bind]]
mode = "normal"
keys = "q<char>"
command = "vim.macro_record"
label = "record macro"

[[bind]]
mode = "normal"
keys = "q"
command = "vim.macro_record"
when = "vim.recording"
nowait = true

[[bind]]
mode = "normal"
keys = "@<char>"
command = "vim.macro_play"
label = "play macro"

[[bind]]
mode = "normal"
keys = "<Esc>"
command = "editor.collapse_selection"

