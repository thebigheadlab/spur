keys = "f<char>"
command = "vim.find_char"

[[bind]]
mode = "normal operator"
keys = "t<char>"
command = "vim.find_char"
args = { till = true }

[[bind]]
mode = "normal operator"
keys = "F<char>"
command = "vim.find_char"
args = { backward = true }

[[bind]]
mode = "normal operator"
keys = "T<char>"
command = "vim.find_char"
args = { till = true, backward = true }

[[bind]]
mode = "normal operator"
keys = ";"
command = "vim.repeat_find"

[[bind]]
