[[bind]]
mode = "normal operator"
keys = "<Space>"
command = "editor.move_right"

[[bind]]
mode = "normal operator"
keys = "j"
command = "editor.move_down"

[[bind]]
mode = "normal operator"
keys = "<Down>"
command = "editor.move_down"

[[bind]]
mode = "normal operator"
keys = "k"
command = "editor.move_up"

[[bind]]
mode = "normal operator"
keys = "<Up>"
command = "editor.move_up"

[[bind]]
mode = "normal operator"
keys = "w"
command = "editor.move_word_next"

[[bind]]
mode = "normal operator"
keys = "W"
command = "editor.move_word_next"
args = { big = true }

[[bind]]
mode = "normal operator"
keys = "b"
command = "editor.move_word_prev"

[[bind]]
mode = "normal operator"
keys = "B"
command = "editor.move_word_prev"
args = { big = true }

[[bind]]
mode = "normal operator"
keys = "e"
command = "editor.move_word_end"

[[bind]]
mode = "normal operator"
keys = "E"
command = "editor.move_word_end"
