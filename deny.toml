[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]

# The palette's fuzzy matcher. MPL-2.0 is file-level copyleft: using the crates
# unmodified puts no terms on Spur's own files.
exceptions = [
  { allow = ["MPL-2.0"], crate = "nucleo" },
  { allow = ["MPL-2.0"], crate = "nucleo-matcher" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
