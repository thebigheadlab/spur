# Lean CI. Rust builds are expensive, so:
# - PRs run one Linux job (fmt -> clippy -> nextest).
# - macOS + Windows run on main, or on a PR when a maintainer comments
#   `/ci full` (see ci-full.yml).
# - Docs-only changes skip CI; superseded runs are cancelled.
# - Cache is written only from main, so PRs never thrash it.
# - No secrets are used; fork PRs get a read-only token.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/dependabot.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

jobs:
  linux:
    name: lint + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --cargo-profile ci --locked --no-tests=warn
      - run: cargo test --workspace --doc --locked

  cross-os:
    name: test (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test-os.yml
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    with:
      os: ${{ matrix.os }}
