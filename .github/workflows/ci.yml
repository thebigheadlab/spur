# Lean CI. Rust builds are expensive, so:
# - PRs run one Linux job (fmt -> clippy -> test).
# - macOS + Windows run on main, or on a PR when a maintainer asks for it
#   (see ci-full.yml).
# - Docs-only changes skip CI; superseded PR runs are cancelled.
# - Cache is written only from main, so PRs never thrash it.
# - No secrets are used; fork PRs get a read-only token.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/dependabot.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: lint + test (linux)
    uses: ./.github/workflows/test-os.yml
    with:
      os: ubuntu-latest
      fmt: true

  cross-os:
    name: test (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test-os.yml
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    with:
      os: ${{ matrix.os }}
