# Public-repo hygiene. Cheap (no Rust build), runs on every PR and push.
# - gitleaks: secrets/tokens/keys in commits.
# - commit emails: author/committer must be a noreply address.
name: Secrets

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly full-history scan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            r="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            r="$BEFORE..$AFTER"
          else
            r="--all"
          fi
          echo "range=$r" >> "$GITHUB_OUTPUT"
          echo "Scanning: $r"

      - name: gitleaks
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --redact --no-banner --log-opts="$RANGE" /repo

      - name: Commit emails are noreply
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          bad=$(git log $RANGE --format='%h %ae%n%h %ce' \
            | grep -vE ' ([^@ ]+@users\.noreply\.github\.com|noreply@github\.com|noreply@anthropic\.com)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits use non-noreply emails (see SECURITY.md):"
            echo "$bad" | sed 's/@.*/@<redacted>/'
            exit 1
          fi
          echo "All commit emails are noreply."
