# On-demand full OS matrix for a PR. A maintainer comments `/ci full` on the PR.
# Guarded so the public cannot trigger it:
# - only OWNER / MEMBER / COLLABORATOR comments are honoured;
# - the PR head SHA is pinned at trigger time (later pushes need a new `/ci full`);
# - read-only token for the test jobs, no secrets, credentials not persisted.
# Note: issue_comment workflows run from the default branch's copy of this file.
name: CI full

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ci full') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # read head SHA, react to the comment
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=rocket >/dev/null || true
          echo "Running full matrix for PR #$PR at $sha"

  test:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/test-os.yml
    with:
      os: ${{ matrix.os }}
      ref: ${{ needs.gate.outputs.sha }}

  report:
    needs: [gate, test]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
          RESULT: ${{ needs.test.result }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure; [ "$RESULT" = success ] && state=success
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="CI full (3 OS)" -f target_url="$URL" \
            -f description="linux + macos + windows: $RESULT"
