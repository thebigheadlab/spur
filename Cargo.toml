[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thebigheadlab/spur"
publish = false

[workspace.dependencies]
spur-text = { path = "crates/spur-text" }
spur-core = { path = "crates/spur-core" }
spur-keymap = { path = "crates/spur-keymap" }
spur-ext = { path = "crates/spur-ext" }
spur-rpc = { path = "crates/spur-rpc" }
spur-tui = { path = "crates/spur-tui" }
spur-gui = { path = "crates/spur-gui" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.ci]
# Lean profile for CI test runs: no debuginfo, smaller target dir, faster links.
inherits = "dev"
debug = false
incremental = false
